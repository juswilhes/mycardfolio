<svg viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Icon: zwei gestapelte, abgerundete Karten - "Folio" = Sammlung mehrerer Karten -->
  <g>
    <!-- hintere Karte, nur Umriss, leicht gedreht -->
    <rect x="30" y="26" width="118" height="164" rx="24"
          transform="rotate(9 89 108)"
          fill="none" stroke="#241c15" stroke-width="7" />
    <!-- vordere Karte, gelb gefüllt -->
    <rect x="14" y="34" width="118" height="164" rx="24"
          fill="#f8c93a" stroke="#241c15" stroke-width="7" />
    <!-- kleines Symbol auf der vorderen Karte, deutet einen Chart/Wert an -->
    <polyline points="38,150 62,120 82,134 108,90"
              fill="none" stroke="#241c15" stroke-width="7"
              stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Wortmarke -->
  <text x="200" y="132" font-family="'Poppins', 'Arial', sans-serif" font-weight="700"
        font-size="72" fill="#241c15">my</text>
  <text x="290" y="132" font-family="'Poppins', 'Arial', sans-serif" font-weight="800"
        font-size="72" fill="#241c15">card</text>
  <text x="490" y="132" font-family="'Poppins', 'Arial', sans-serif" font-weight="800"
        font-size="72" fill="#e0af1a">folio</text>

  <!-- gelbe Unterstreichung unter "folio", verbindet Icon-Farbe und Wortmarke -->
  <rect x="490" y="150" width="196" height="10" rx="5" fill="#f8c93a" />
</svg>
