<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Preisverlauf mit einzelnem Ausreißer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a44"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="560" r="190" fill="#ff6b81" opacity="0.07"/>

  <!-- Raster -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="2">
    <path d="M120 120H1080M120 235H1080M120 350H1080M120 465H1080M120 540H1080"/>
  </g>

  <!-- bereinigte Linie (gestrichelt, grün) -->
  <path d="M120 400 L240 380 L360 420 L480 390 L600 405 L720 395 L840 400 L960 392 L1080 398"
        fill="none" stroke="#35d488" stroke-width="6" stroke-dasharray="4 16" stroke-linecap="round"/>

  <!-- Rohdaten mit Ausreißer (gelb) -->
  <path d="M120 400 L240 380 L360 420 L480 390 L600 405 L660 130 L720 395 L840 400 L960 392 L1080 398"
        fill="none" stroke="#f8c93a" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Ausreißer-Punkt -->
  <circle cx="660" cy="130" r="26" fill="none" stroke="#ff6b81" stroke-width="6"/>
  <circle cx="660" cy="130" r="10" fill="#ff6b81"/>
  <circle cx="720" cy="395" r="9" fill="#35d488"/>

  <text x="705" y="140" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">85 €</text>
  <text x="745" y="460" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#35d488">36 €</text>
  <text x="120" y="595" font-family="Poppins, Arial, sans-serif" font-size="24" fill="#ffffff" fill-opacity="0.65">ein Tag Ausreißer, danach wieder normal</text>
</svg>
